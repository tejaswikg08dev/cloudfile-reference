# Standalone local stack for the notification service (its own repo).

services:
  notify-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: notify
      POSTGRES_PASSWORD: notify
      POSTGRES_DB: notifications
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --auth-local=scram-sha-256"
    ports:
      - "5433:5432"
    volumes:
      - notifypg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notify -d notifications"]
      interval: 5s
      timeout: 5s
      retries: 10

  notification:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      NOTIFICATION_DATABASE_URL: postgresql+asyncpg://notify:notify@notify-db:5432/notifications
      JWT_SECRET_KEY: local-dev-secret-change-me-0123456789
      JWT_ALGORITHM: HS256
      # Change to "smtp" to send real email via Mailtrap (fill SMTP_* below or
      # in a .env file). Keep "console" to just log + record notifications.
      NOTIFICATION_PROVIDER: ${NOTIFICATION_PROVIDER:-console}
      LOG_LEVEL: INFO
      # SMTP / Mailtrap (read from your shell env or a .env file; blank = unused)
      SMTP_HOST: ${SMTP_HOST:-sandbox.smtp.mailtrap.io}
      SMTP_PORT: ${SMTP_PORT:-2525}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_SENDER: ${SMTP_SENDER:-no-reply@cloudfile.example.com}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-true}
    ports:
      - "8004:8004"
    depends_on:
      notify-db:
        condition: service_healthy

volumes:
  notifypg:
