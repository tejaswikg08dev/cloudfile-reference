name: CD

# Builds images for changed services, pushes to ECR, and updates ECS services.
# Requires these repository secrets:
#   AWS_ROLE_ARN (OIDC) or AWS_ACCESS_KEY_ID + AWS_SECRET_ACCESS_KEY
#   AWS_REGION, AWS_ACCOUNT_ID

on:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  PROJECT: cloudfile

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [auth, files, search]
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          IMAGE: ${{ env.PROJECT }}-${{ matrix.service }}
          TAG: ${{ github.sha }}
        run: |
          docker build \
            -f services/${{ matrix.service }}/Dockerfile \
            -t $REGISTRY/$IMAGE:$TAG \
            -t $REGISTRY/$IMAGE:latest \
            .
          docker push $REGISTRY/$IMAGE:$TAG
          docker push $REGISTRY/$IMAGE:latest

      - name: Force new ECS deployment
        run: |
          aws ecs update-service \
            --cluster ${{ env.PROJECT }}-cluster \
            --service ${{ env.PROJECT }}-${{ matrix.service }} \
            --force-new-deployment \
            --region ${{ secrets.AWS_REGION }} || \
          echo "ECS service not found yet; skipping (first deploy via Terraform)."
