apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth
  namespace: cloudfile
  labels:
    app: auth
spec:
  replicas: 2
  selector:
    matchLabels:
      app: auth
  template:
    metadata:
      labels:
        app: auth
    spec:
      containers:
        - name: auth
          # Replace with your registry image, e.g. <acct>.dkr.ecr.<region>.amazonaws.com/cloudfile-auth:latest
          image: cloudfile-auth:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8001
          envFrom:
            - configMapRef:
                name: cloudfile-config
            - secretRef:
                name: cloudfile-secrets
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 10
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: auth
  namespace: cloudfile
spec:
  selector:
    app: auth
  ports:
    - port: 8001
      targetPort: 8001
