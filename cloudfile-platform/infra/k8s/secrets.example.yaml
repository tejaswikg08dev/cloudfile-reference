# Copy to secrets.yaml and fill in real values. NEVER commit secrets.yaml.
# Create for real with:
#   kubectl -n cloudfile create secret generic cloudfile-secrets \
#     --from-literal=JWT_SECRET_KEY=... \
#     --from-literal=AWS_ACCESS_KEY_ID=... \
#     --from-literal=AWS_SECRET_ACCESS_KEY=...
apiVersion: v1
kind: Secret
metadata:
  name: cloudfile-secrets
  namespace: cloudfile
type: Opaque
stringData:
  JWT_SECRET_KEY: "change-me-use-a-long-random-string"
  AWS_ACCESS_KEY_ID: "test"
  AWS_SECRET_ACCESS_KEY: "test"
