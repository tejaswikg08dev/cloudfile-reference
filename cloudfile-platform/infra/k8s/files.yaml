apiVersion: apps/v1
kind: Deployment
metadata:
  name: files
  namespace: cloudfile
  labels:
    app: files
spec:
  replicas: 2
  selector:
    matchLabels:
      app: files
  template:
    metadata:
      labels:
        app: files
    spec:
      containers:
        - name: files
          image: cloudfile-files:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8002
          envFrom:
            - configMapRef:
                name: cloudfile-config
            - secretRef:
                name: cloudfile-secrets
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8002
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8002
            initialDelaySeconds: 10
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: files
  namespace: cloudfile
spec:
  selector:
    app: files
  ports:
    - port: 8002
      targetPort: 8002
